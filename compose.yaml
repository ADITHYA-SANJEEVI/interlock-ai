name: interlock-pass0
services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: interlock
      POSTGRES_PASSWORD: local_only
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pass0_postgres:/var/lib/postgresql
      - ./infra/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlock"]
      interval: 3s
      retries: 20
  api:
    build: .
    env_file: [.env.api]
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg://interlock_api:local_only@postgres:5432/control
      BROKER_URL: http://broker:8001
      SELLER_URL: http://seller:8002
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    command: ["uvicorn", "interlock.api:app", "--host", "0.0.0.0", "--port", "8000"]
  broker:
    build: .
    env_file: [.env.broker, .env.razorpay, .env.pass2.broker, .env.pass3.broker]
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg://interlock_broker:local_only@postgres:5432/control
      SELLER_URL: http://seller:8002
      REFERENCE_URL: http://reference:8003
    ports: ["127.0.0.1:8001:8001"]
    command: ["uvicorn", "interlock.broker:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    env_file: [.env.worker, .env.pass2.worker]
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg://interlock_worker:local_only@postgres:5432/control
      BROKER_URL: http://broker:8001
    command: ["python", "-m", "interlock.worker"]
    depends_on:
      postgres: {condition: service_healthy}
  seller:
    build: .
    env_file: [.env.seller]
    environment:
      SELLER_DATABASE_URL: postgresql+psycopg://interlock_seller:local_only@postgres:5432/seller
    ports: ["127.0.0.1:8002:8002"]
    command: ["uvicorn", "interlock.seller:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      postgres: {condition: service_healthy}
  reference:
    build: .
    env_file: [.env.reference]
    environment:
      REFERENCE_DATABASE_URL: postgresql+psycopg://interlock_reference:local_only@postgres:5432/reference
    ports: ["127.0.0.1:8003:8003"]
    command: ["uvicorn", "interlock.reference:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      postgres: {condition: service_healthy}
  economic:
    build: .
    environment:
      ECONOMIC_DATABASE_URL: postgresql+psycopg://interlock_economic:local_only@postgres:5432/control
      SELLER_URL: http://seller:8002
    command: ["python", "-m", "interlock.economic_worker"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pass0_postgres:
