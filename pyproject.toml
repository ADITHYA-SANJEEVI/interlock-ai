[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interlock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.41.0", "pydantic==2.12.5", "sqlalchemy==2.0.48", "alembic==1.18.4", "psycopg[binary]==3.3.3", "httpx==0.28.1", "python-dotenv==1.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6", "mypy==1.19.1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["backend"]
check_untyped_defs = true
ignore_missing_imports = true
